<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Video Auswahl</title>
    <style>
        
        

        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: IBM Plex Sans, regular;
            font-weight:500;
            letter-spacing: -0.099cm;
            transition: none;
            overflow: hidden;
        }



        /* simulate sketch canvas size and center it */
        #menu {
            position: relative;
            width: 750px;
            height: 1334px;
            max-width: 100%;
            max-height: 100vh;
            margin: 0 auto;
            font-size: 43px;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* subtle floating animation for the words (each word has a unique animation) */
        .word {
            position: absolute;
            display: inline-block;
            color: inherit;
            will-change: transform;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* different animations so words don't move the same */
        .word.s1 { animation: float1 4.2s ease-in-out infinite; animation-delay: 0s; }
        .word.s2 { animation: float2 3.1s ease-in-out infinite; animation-delay: 0.25s; }
        .word.s3 { animation: float3 5.0s cubic-bezier(.25,.46,.45,.94) infinite; animation-delay: 0.55s; }

        @keyframes float1 { 0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-12px) translateX(2px)}100%{transform:translateY(0) translateX(0)} }
        @keyframes float2 { 0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-6px) translateX(-6px)}100%{transform:translateY(0) translateX(0)} }
        @keyframes float3 { 0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-18px) translateX(1px)}100%{transform:translateY(0) translateX(0)} }

        #videoPlayer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            background: black;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="menu">
        <div class="word s1" onclick="playRandom('schaum')">schaumkronen</div>
        <div class="word s2" onclick="playRandom('blaetter')">blätterschatten</div>
        <div class="word s3" onclick="playRandom('wind')">windheulen</div>
    </div>

    <video id="videoPlayer" playsinline webkit-playsinline></video>

    <script>
        function requestFullscreen(el){
            const target = el || document.documentElement;

            if (target.requestFullscreen){
                target.requestFullscreen();
            } else if (target.webkitRequestFullscreen){
                target.webkitRequestFullscreen();
            } else if (typeof target.webkitEnterFullscreen === 'function'){
                // iOS Safari video fullscreen API
                try { target.webkitEnterFullscreen(); } catch(e){}
            }
        }
        const videos = {
            schaum: [
                "videos/schaum1.mp4",
                "videos/schaum2.mp4",
                "videos/schaum3.mp4"
            ],
            blaetter: [
                "videos/blaetter1.mp4",
                "videos/blaetter2.mp4",
                "videos/blaetter3.mp4"
            ],
            wind: [
                "videos/wind1.mp4",
                "videos/wind2.mp4",
                "videos/wind3.mp4"
            ]
        };

        const menu = document.getElementById("menu");
        const player = document.getElementById("videoPlayer");

        // placeWords: position each menu word closer together inside the 750x1334 menu
        function placeWords() {
            const words = document.querySelectorAll("#menu .word");
            const rect = menu.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            // center vertical band and small offsets so words stay close
            const centerY = height * 0.5;
            const offsetsY = [-60, 0, 60];
            const baseXs = [width * 0.28, width * 0.5, width * 0.72];

            words.forEach((word) => {
                word.style.position = 'absolute';
                word.style.left = '0px';
                word.style.top = '0px';
            });

            requestAnimationFrame(() => {
                words.forEach((word, index) => {
                    const jitterX = (Math.random() - 0.5) * 30; // ±15px
                    const jitterY = (Math.random() - 0.5) * 20; // ±10px

                    let left = Math.round(baseXs[index] - word.offsetWidth / 2 + jitterX);
                    let top = Math.round(centerY + offsetsY[index] + jitterY - word.offsetHeight / 2);

                    // clamp inside menu
                    left = Math.max(0, Math.min(left, Math.max(0, width - word.offsetWidth)));
                    top = Math.max(0, Math.min(top, Math.max(0, height - word.offsetHeight)));

                    word.style.left = `${left}px`;
                    word.style.top = `${top}px`;
                });
            });
        }

        window.addEventListener("load", placeWords);
        window.addEventListener("resize", placeWords);

        function playRandom(category) {
            // try to open fullscreen on the video element or document (must be a direct user gesture)
            
            const list = videos[category];
            const randomIndex = Math.floor(Math.random() * list.length);
            const selectedVideo = list[randomIndex];

            menu.style.display = "none";
            player.style.display = "block";
            player.controls = false;
            player.setAttribute("playsinline", "");
            player.setAttribute("webkit-playsinline", "");
            player.src = selectedVideo;
            // request fullscreen as part of the user click gesture
            try{ requestFullscreen(player); } catch(e){}
            player.load();
            // start playback (handle promise rejection)
            const p = player.play();
            if (p && p.catch) p.catch(err => console.log('play() error:', err));
        }
        // Wenn Video zu Ende → zurück zum Menü
        player.addEventListener("ended", () => {
            player.style.display = "none";
            menu.style.display = "flex";
            player.src = "";
        });
    </script>

</body>
</html>
