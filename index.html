<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Video Auswahl</title>
    <style>
        
        

        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: IBM Plex Sans, regular;
            font-weight:500;
            letter-spacing: -0.099cm;
            transition: none;
            overflow: hidden;
        }



        #menu {
            /* positioned container so absolutely-placed words are relative to it */
            position: relative;
            inset: 0;
            height: 100vh;
            font-size: 43px;
            cursor: pointer;
        }

        /* subtle floating animation for the words */
        .word {
            position: absolute;
            display: inline-block;
            color: inherit;
            animation: floatWord 3.5s ease-in-out infinite;
            will-change: transform;
            -webkit-tap-highlight-color: transparent;
        }


        @keyframes floatWord {
            0% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }

        #videoPlayer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            background: black;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="menu">
        <div class="word" onclick="playRandom('schaum')">schaumkronen</div>
        <div class="word" onclick="playRandom('blaetter')">blätterschatten</div>
        <div class="word" onclick="playRandom('wind')">windheulen</div>
    </div>

    <video id="videoPlayer" playsinline webkit-playsinline></video>

    <script>
        function requestFullscreen(el){
            const target = el || document.documentElement;

            if (target.requestFullscreen){
                target.requestFullscreen();
            } else if (target.webkitRequestFullscreen){
                target.webkitRequestFullscreen();
            } else if (typeof target.webkitEnterFullscreen === 'function'){
                // iOS Safari video fullscreen API
                try { target.webkitEnterFullscreen(); } catch(e){}
            }
        }
        const videos = {
            schaum: [
                "videos/schaum1.mp4",
                "videos/schaum2.mp4",
                "videos/schaum3.mp4"
            ],
            blaetter: [
                "videos/blaetter1.mp4",
                "videos/blaetter2.mp4",
                "videos/blaetter3.mp4"
            ],
            wind: [
                "videos/wind1.mp4",
                "videos/wind2.mp4",
                "videos/wind3.mp4"
            ]
        };

        const menu = document.getElementById("menu");
        const player = document.getElementById("videoPlayer");

        // placeWords: randomly place each menu word into one third of the screen
        function placeWords() {
            const words = document.querySelectorAll("#menu .word");
            const height = window.innerHeight;

            const thirds = [
                [0, height / 3],            // erstes Drittel
                [height / 3, 2 * height / 3], // zweites Drittel
                [2 * height / 3, height]      // drittes Drittel
            ];

            const shuffledThirds = thirds.sort(() => Math.random() - 0.5);

            words.forEach((word, index) => {
                // ensure word is measured before placing
                word.style.position = 'absolute';
                word.style.left = '0px';
                word.style.top = '0px';
            });

            // allow layout to update then compute positions
            requestAnimationFrame(() => {
                words.forEach((word, index) => {
                    const [minY, maxY] = shuffledThirds[index];
                    const top = minY + Math.random() * Math.max(0, (maxY - minY - word.offsetHeight));
                    const left = Math.random() * Math.max(0, (window.innerWidth - word.offsetWidth));

                    word.style.top = `${top}px`;
                    word.style.left = `${left}px`;
                });
            });
        }

        window.addEventListener("load", placeWords);
        window.addEventListener("resize", placeWords);

        function playRandom(category) {
            // try to open fullscreen on the video element or document (must be a direct user gesture)
            
            const list = videos[category];
            const randomIndex = Math.floor(Math.random() * list.length);
            const selectedVideo = list[randomIndex];

            menu.style.display = "none";
            player.style.display = "block";
            player.controls = false;
            player.setAttribute("playsinline", "");
            player.setAttribute("webkit-playsinline", "");
            player.src = selectedVideo;
            // request fullscreen as part of the user click gesture
            try{ requestFullscreen(player); } catch(e){}
            player.load();
            // start playback (handle promise rejection)
            const p = player.play();
            if (p && p.catch) p.catch(err => console.log('play() error:', err));
        }
        // Wenn Video zu Ende → zurück zum Menü
        player.addEventListener("ended", () => {
            player.style.display = "none";
            menu.style.display = "flex";
            player.src = "";
        });
    </script>

</body>
</html>
